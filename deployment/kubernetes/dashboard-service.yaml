# Service for the dashboard.
#   kubectl -n lms-skills port-forward service/lms-dashboard 8501:80   -> http://127.0.0.1:8501
#   minikube service lms-dashboard -n lms-skills                         (NodePort 30501)
apiVersion: v1
kind: Service
metadata:
  name: lms-dashboard
  labels:
    app.kubernetes.io/name: lms-skills
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: lms-skills-intelligence
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lms-skills
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30501
