# GitHub Actions: runs automatically on every push and pull request.
# A red X on GitHub means a step failed; click it to read the log.
#
# Stages: checkout -> Python 3.11 -> install -> lint -> format check -> tests -> Docker build
# The Docker job runs scripts/api_smoke_test.py against the container (Phase 14), started
# hardened like compose.yaml: read-only, no capabilities, non-root, empty volumes (Phase 18).
# It also renders the Kubernetes manifests (Phase 20).
# The Snyk job (Phase 21) scans dependencies and the image when the repository secret SNYK_TOKEN
# is set, and shows the results in the Security tab. Jenkins runs the full pipeline: Jenkinsfile.

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # reuses downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Tests with coverage (pytest)
        # --cov prints which lines of app/ the tests never run ("Missing" column).
        run: pytest -v --cov=app --cov-report=term-missing:skip-covered

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test               # only builds if lint and tests passed
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Render the Kubernetes manifests (kubectl kustomize, no cluster needed)
        run: kubectl kustomize deployment/kubernetes > /dev/null && echo "Kubernetes manifests render"

      - name: Check the Compose files (syntax, references, required variables)
        run: |
          docker compose config -q
          AUTH_SECRET_KEY=ci-check docker compose -f compose.yaml -f deployment/docker/compose.prod.yaml config -q

      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t aiml-lms-skills-intelligence:ci .

      - name: Image facts - runs as non-root, size
        run: |
          test "$(docker run --rm --entrypoint id aiml-lms-skills-intelligence:ci -u)" = "10001"
          echo "Runs as user 10001 (not root)"
          docker image ls aiml-lms-skills-intelligence:ci --format "Image size: {{.Size}}"

      - name: Start the container HARDENED (as in compose.yaml) and check health
        # read-only root filesystem, no Linux capabilities; only volumes and /tmp are writable.
        # The start step must still create the database and the index on these empty volumes.
        run: |
          docker run -d --name api -p 8000:8000 \
            --read-only --tmpfs /tmp --tmpfs /home/appuser \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v /app/data/db -v /app/vector_store -v /app/data/uploads -v /app/models \
            -v /app/mlruns -v /app/data/accounts -v /app/logs \
            -e ADMIN_API_KEY=ci-test-key -e DATA_SOURCE=database -e DATABASE_URL=sqlite:///./data/db/lms_ai.db \
            aiml-lms-skills-intelligence:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then echo; echo "Health check passed"; break; fi
            if [ "$i" = 45 ]; then echo "Health check failed"; docker logs api; exit 1; fi
            sleep 2
          done
          docker logs api 2>&1 | grep "prepare" || true
          curl -fsS http://127.0.0.1:8000/api/v1/health/rag | grep -q '"ready":true' && echo "Index built by the start step"

      - name: Smoke test - every API over real HTTP (scripts/api_smoke_test.py)
        # Same script you can run on your PC. No Ollama in CI, so the LLM check is a WARN, not a failure.
        run: python3 scripts/api_smoke_test.py --base-url http://127.0.0.1:8000 --wait 60 --admin-key ci-test-key

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs api

  security:
    name: Snyk security scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write          # results appear under Security -> Code scanning
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}   # never printed; empty on forks and Dependabot pull requests
    steps:
      - name: Snyk token configured?
        if: env.SNYK_TOKEN == ''
        run: echo "::notice title=Snyk scan skipped::Add the repository secret SNYK_TOKEN to scan (docs/SNYK_SECURITY_GUIDE.md)."

      - name: Check out code
        if: env.SNYK_TOKEN != ''
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the dependencies Snyk examines
        if: env.SNYK_TOKEN != ''
        run: pip install -r requirements.txt

      - name: Install the Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: npm install --global snyk@1

      - name: Snyk dependency scan (requirements.txt)
        if: env.SNYK_TOKEN != ''
        # Reported, not blocking: a vulnerability published today must not stop unrelated work.
        # The findings are visible in the log and in the Security tab; fix them in the next phase branch.
        continue-on-error: true
        run: snyk test --file=requirements.txt --package-manager=pip --command=python --severity-threshold=high --sarif-file-output=snyk-dependencies.sarif

      - name: Build the image for the container scan
        if: env.SNYK_TOKEN != ''
        run: docker build -t aiml-lms-skills-intelligence:snyk .

      - name: Snyk container scan (base image + system packages)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk container test aiml-lms-skills-intelligence:snyk --file=Dockerfile --policy-path=.snyk --severity-threshold=high --sarif-file-output=snyk-container.sarif

      - name: Upload dependency results to the Security tab
        if: always() && env.SNYK_TOKEN != '' && hashFiles('snyk-dependencies.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dependencies.sarif
          category: snyk-dependencies

      - name: Upload container results to the Security tab
        if: always() && env.SNYK_TOKEN != '' && hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
