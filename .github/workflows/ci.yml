# GitHub Actions: runs automatically on every push and pull request.
# A red X on GitHub means a step failed; click it to read the log.
#
# Stages: checkout -> Python 3.11 -> install -> lint -> format check -> tests -> Docker build
# The Docker job runs scripts/api_smoke_test.py against the container (Phase 14).
# Later phases add: Snyk security scan, image publish and deploy.

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # reuses downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Tests with coverage (pytest)
        # --cov prints which lines of app/ the tests never run ("Missing" column).
        run: pytest -v --cov=app --cov-report=term-missing:skip-covered

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test               # only builds if lint and tests passed
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aiml-lms-skills-intelligence:ci .

      - name: Start container and check health
        run: |
          docker run -d --name api -p 8000:8000 -e ADMIN_API_KEY=ci-test-key aiml-lms-skills-intelligence:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then echo; echo "Health check passed"; exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker logs api; exit 1

      - name: Smoke test - every API over real HTTP (scripts/api_smoke_test.py)
        # Same script you can run on your PC. No Ollama in CI, so the LLM check is a WARN, not a failure.
        run: python3 scripts/api_smoke_test.py --base-url http://127.0.0.1:8000 --wait 60 --admin-key ci-test-key

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs api
