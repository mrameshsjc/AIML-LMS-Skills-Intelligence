# GitHub Actions: runs automatically on every push and pull request.
# A red X on GitHub means a step failed; click it to read the log.
#
# Stages: checkout -> Python 3.11 -> install -> lint -> format check -> tests -> Docker build
# Later phases add: Snyk security scan, image publish, deploy and smoke test.

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # reuses downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test               # only builds if lint and tests passed
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aiml-lms-skills-intelligence:ci .

      - name: Start container and check health
        run: |
          docker run -d --name api -p 8000:8000 aiml-lms-skills-intelligence:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then echo; echo "Health check passed"; exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker logs api; exit 1

      - name: Smoke test - skills analysis API
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/skills/analyze \
            -H "Content-Type: application/json" \
            -d '{"employee_id": "E1001", "target_role_id": "R004"}' | tee response.json
          grep -q '"gap_score":37.5' response.json && echo && echo "Skills analysis smoke test passed"

      - name: Smoke test - role matching API
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/roles/match \
            -H "Content-Type: application/json" \
            -d '{"employee_id": "E1001"}' | tee roles.json
          grep -q '"title":"Data Engineer"' roles.json && echo && echo "Role matching smoke test passed"
