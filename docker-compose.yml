# Docker Compose: runs one or more containers together with one command.
#
#   Start:   docker compose up --build        (add -d to run in background)
#   Status:  docker compose ps                 (shows "healthy" when ready)
#   Logs:    docker compose logs -f api
#   Stop:    docker compose down
#
# Services: api (FastAPI, port 8000) and dashboard (Streamlit, port 8501, Phase 15).
# Later phases add mlflow and, optionally, ollama and mysql - all on the same network.

services:
  api:
    build: .
    image: aiml-lms-skills-intelligence:dev
    container_name: aiml-lms-skills-api
    ports:
      - "8000:8000"          # host:container -> open http://127.0.0.1:8000/docs
    env_file:
      - path: .env           # your local settings (copied from .env.example)
        required: false      # still starts if .env does not exist yet
    environment:
      APP_PROFILE: compose   # tells the app it runs inside Docker Compose
      USERS_FILE: data/accounts/users.json   # login accounts on a volume (Phase 17)
      # Inside a container, "localhost" is the container itself. Ollama runs on your PC,
      # which containers reach as host.docker.internal (Phase 11).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes that name work on Linux too (Docker Desktop has it already)
    volumes:
      - lms_data:/app/data/uploads   # keeps uploaded files when the container is recreated
      - lms_index:/app/vector_store  # keeps the knowledge index (Phase 12)
      - lms_models:/app/models       # trained model versions (shared with the dashboard)
      - lms_accounts:/app/data/accounts  # login accounts (Phase 17): docker compose exec api python scripts/create_user.py ...
      - lms_logs:/app/logs           # the audit log (Phase 17)
      # (data/sample is inside the image; later phases add volumes for the database and indexes)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  dashboard:
    image: aiml-lms-skills-intelligence:dev   # the same image as the api: same code, same services
    container_name: aiml-lms-skills-dashboard
    command: ["streamlit", "run", "dashboard/Home.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"          # open http://127.0.0.1:8501
    env_file:
      - path: .env
        required: false
    environment:
      APP_PROFILE: compose
      USERS_FILE: data/accounts/users.json
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:                 # the same volumes as the api, so both see the same index, uploads and models
      - lms_data:/app/data/uploads
      - lms_index:/app/vector_store
      - lms_models:/app/models
      - lms_accounts:/app/data/accounts
      - lms_logs:/app/logs
    depends_on:
      - api
    restart: unless-stopped

volumes:
  lms_data:                  # named volume managed by Docker (survives `docker compose down`)
  lms_index:                 # the knowledge index built by scripts/build_index.py
  lms_models:                # completion model versions
  lms_accounts:              # login accounts (data/accounts/users.json)
  lms_logs:                  # audit log
